name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  marketplace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Validate marketplace
        run: node scripts/validate-marketplace.mjs

      - name: Test skill helpers and routing harness offline
        run: node --test scripts/trigger-test.test.mjs scripts/skill-behavior.test.mjs

      - name: Test the skill quality gate
        run: python3 scripts/skill_gate.py --self-test

      - name: Skill quality gate (Tier 1, budget, Tier 2/3 evidence)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            BASE="${{ github.event.before }}"
          else
            BASE="HEAD~1"
          fi
          python3 scripts/skill_gate.py check --base "$BASE"

      - name: Build packs
        run: ./build-packs.sh

      - name: Sync public docs
        run: node scripts/sync-marketplace-docs.mjs

      - name: Fail on generated drift
        run: |
          git diff --exit-code -- \
            plugins/ \
            .claude-plugin/ \
            docs/skills.html \
            docs/index.html \
            README.md \
            INSTALL.md \
            SKILL_TAXONOMY.md \
            packs.config.json
